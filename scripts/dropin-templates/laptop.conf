# coolstep drop-in: laptop profile
# Generated by scripts/coolstep_init.sh — edit the template, not this file.
# Template: scripts/dropin-templates/laptop.conf
#
# CPUQuota: 10% — keeps collector off-screen on battery
# MemoryMax: 512M — sufficient for KNN ring (~42k vectors ≈ 250M RSS)
# Actuator: allowed on laptops (asusctl fan-curve bias is harmless on
#   chassis without asusctl — the actuator no-ops when the binary is
#   missing).
#
# Slice: intentionally omitted; the unit defaults to `user.slice`, which
# always exists on every systemd-managed user session.  Pin a custom
# slice in a higher-numbered drop-in if you want one, e.g.:
#   printf '[Service]\nSlice=mine.slice\n' > 10-my-slice.conf
[Service]
CPUQuota=10%
MemoryMax=512M
