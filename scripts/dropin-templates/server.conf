# coolstep drop-in: server profile
# Generated by scripts/coolstep_init.sh — edit the template, not this file.
# Template: scripts/dropin-templates/server.conf
#
# CPUQuota: 50% — sustained server workloads; collector piggybacks on spare
# MemoryMax: 2G — large ring for server telemetry history
# Actuator: DISABLED on servers (observation-only; no asusctl/fan HW present)
#   To enable manually: add Environment=COOLSTEP_ACTUATOR_ENABLE=true in a
#   separate drop-in (not recommended for headless servers).
#
# Slice: omitted; defaults to user.slice.  Pin a custom slice in a
# higher-numbered drop-in if you want one.
[Service]
CPUQuota=50%
MemoryMax=2G
Environment=COOLSTEP_ACTUATOR_ENABLE=false
