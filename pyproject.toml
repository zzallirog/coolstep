[project]
name = "coolstep"
version = "0.5.0"
description = "Predictive soft-cooling — modular per-host thermal/load orchestrator with live ML dashboard"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "zzalli" }]

dependencies = [
    "psutil>=6.0",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "click>=8.1",
]

[project.optional-dependencies]
nvidia = ["nvidia-ml-py>=12.560"]
amd = ["pyamdgpuinfo>=2.1"]
ml = [
    "scikit-learn>=1.5",
    "xgboost>=2.1",
    "hdbscan>=0.8.40",
    "numpy>=2.0",
    "pandas>=2.2",
    "chromadb>=0.5",
]
dev = [
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "freezegun>=1.5",
    "ruff>=0.7",
    "mypy>=1.13",
]

[project.scripts]
coolstep = "coolstep.inspect.cli:main"
coolstep-collector = "coolstep.daemon:run_collector"
coolstep-dashboard = "coolstep.dashboard.server:run_dashboard"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["coolstep*"]
exclude = ["tests*", "docs*", "data*"]

[tool.setuptools.package-data]
"coolstep.compat" = ["core.json"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "C90"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["coolstep/core"]

[[tool.mypy.overrides]]
module = "coolstep.adapters.*"
strict = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --tb=short --strict-markers"
filterwarnings = ["ignore::DeprecationWarning"]
markers = [
    "slow: tests known to be slow or unreliable (e.g. chromadb integration on Python 3.14)",
]
