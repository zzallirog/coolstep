[project]
name = "coolstep"
version = "0.5.17"
description = "Predictive soft-cooling — modular per-host thermal/load orchestrator with live ML dashboard"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "zzalli" }]

dependencies = [
    "psutil>=6.0",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "click>=8.1",
]

[project.optional-dependencies]
nvidia = ["nvidia-ml-py>=12.560"]
amd = ["pyamdgpuinfo>=2.1"]
ml = [
    "scikit-learn>=1.5",
    "xgboost>=2.1",
    "hdbscan>=0.8.40",
    "numpy>=2.0",
    "pandas>=2.2",
    # Pin <1.0: chromadb 1.x rust-bindings SEGV on Python 3.14 (rust.py:440 in
    # Collection._get). Production workaround: COOLSTEP_CHROMA_DISABLED=1 +
    # drop-in 60-chroma-disabled.conf. Tests auto-skip when chromadb>=1.0.
    "chromadb>=0.5,<1.0",
    # HNSW backend for KNN predictor — replaces chromadb on the hot path
    # under tight CPU-slice budgets. See ADR-022 in docs/stack-decisions.md.
    # We pin chroma-hnswlib (chromadb's vendored fork) rather than upstream
    # `hnswlib`: both packages install the same `hnswlib` module file, so
    # `pip install hnswlib>=0.8` silently overwrites the fork's .so and
    # breaks chromadb's `load_index(is_persistent_index=True)`. The fork's
    # API is a superset of what coolstep's HnswStore needs.
    "chroma-hnswlib>=0.7.6",
]
mcp = [
    "mcp[cli]>=1.0",
]
dev = [
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "freezegun>=1.5",
    "ruff>=0.7",
    "mypy>=1.13",
]

[project.scripts]
coolstep = "coolstep.inspect.cli:main"
coolstep-collector = "coolstep.daemon:run_collector"
coolstep-dashboard = "coolstep.dashboard.server:run_dashboard"
coolstep-mcp = "coolstep.mcp_server:main"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["coolstep*"]
exclude = ["tests*", "docs*", "data*"]

[tool.setuptools.package-data]
"coolstep.compat" = ["core.json"]
"coolstep.dashboard" = [
    "static/*.html",
    "static/*.css",
    "static/*.js",
    "static/components/*.js",
    "static/pills/*.js",
    "static/i18n/*.json",
    "static/i18n/*.js",
    "static/lib/*",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "C90"]
# E501: long lines OK (line-length already 100).
# Legacy debt (pre-2026-05-24, tracked for incremental cleanup, not blocking):
#   SIM105 — try/except/pass → contextlib.suppress; semantic-identical refactor
#   SIM102 — collapsible nested ifs; style only
#   SIM115/SIM117 — open() context manager / parenthesised with-statements
#   B904   — explicit `from exc` in re-raises; Python 3 best practice
#   E402   — module-level imports not at top (often conditional / lazy by design)
ignore = ["E501", "SIM105", "SIM102", "SIM115", "SIM117", "B904", "E402"]

[tool.ruff.lint.mccabe]
# Raise from default 10 → 200 to cover all existing complex functions as of
# 2026-05-24. Worst offenders: dashboard/server.py:create_app (183),
# daemon.py:_tick (40), compat/install_plan.py:caps_to_install_plan (34),
# self_monitor route (37). Real refactor is on the P3 polish backlog; for
# now we accept measured complexity rather than block on hook.
max-complexity = 200

[tool.mypy]
python_version = "3.12"
strict = true
files = ["coolstep/core"]

[[tool.mypy.overrides]]
module = "coolstep.adapters.*"
strict = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --tb=short --strict-markers"
filterwarnings = ["ignore::DeprecationWarning"]
markers = [
    "slow: tests known to be slow or unreliable (e.g. chromadb integration on Python 3.14)",
]
